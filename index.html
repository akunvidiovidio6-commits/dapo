<style>
:root{
  /* Layout: single-column phone wallet. Teal balance card with a raised quick-action tray, 4-col service grid, bottom nav with a raised amber scan button. */
  --bg:#F1F5F2; --surface:#FFFFFF; --ink:#12201E; --muted:#5B6F6B; --line:#DAE3DF;
  --brand:#0B5D5A; --brand-ink:#FFFFFF; --brand-soft:#DCEDE9;
  --hero:#0B5D5A; --hero-ink:#F2FBF9; --hero-mute:#A9D3CD;
  --accent:#F4B42A; --accent-ink:#2B1F00;
  --good:#177E52; --bad:#B8402C;
  --qr-bg:#FFFFFF; --qr-fg:#0B1F1D; --scan-bg:#0B1B19; --av-l:86%;
  --shadow:0 1px 2px rgba(10,40,36,.06),0 8px 22px rgba(10,40,36,.07);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-m:16px; --r-l:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1413; --surface:#13221F; --ink:#E6F0EE; --muted:#8FA6A1; --line:#223531;
  --brand:#38C2B3; --brand-ink:#03201C; --brand-soft:#173532;
  --hero:#0F4B48; --hero-ink:#F0FAF8; --hero-mute:#8FC9C1;
  --good:#4BC98F; --bad:#F08A76; --av-l:26%; --shadow:0 1px 0 rgba(255,255,255,.03);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1413; --surface:#13221F; --ink:#E6F0EE; --muted:#8FA6A1; --line:#223531;
  --brand:#38C2B3; --brand-ink:#03201C; --brand-soft:#173532;
  --hero:#0F4B48; --hero-ink:#F0FAF8; --hero-mute:#8FC9C1;
  --good:#4BC98F; --bad:#F08A76; --av-l:26%; --shadow:0 1px 0 rgba(255,255,255,.03);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,p{margin:0}
.muted{color:var(--muted)}
.shell{max-width:480px;margin:0 auto;padding-block:12px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{flex:none}

/* header + hero */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}
.brand{display:flex;align-items:center;gap:8px;font:700 24px var(--f-display);letter-spacing:-.03em}
.brand svg{width:30px;height:30px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.hello{font:600 15px var(--f-body);color:var(--muted);margin-bottom:12px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:var(--r-l);padding:20px 20px 54px}
.hero .arcs{position:absolute;right:-70px;top:-70px;width:260px;height:260px;opacity:.14;pointer-events:none;color:var(--hero-ink)}
.hero-row{display:flex;align-items:center;justify-content:space-between}
.lbl{font-size:13px;color:var(--hero-mute);letter-spacing:.02em}
.eye{background:none;border:0;color:var(--hero-ink);width:36px;height:36px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.bal{position:relative;font:700 40px/1.1 var(--f-display);letter-spacing:-.03em;margin:4px 0 16px;font-variant-numeric:tabular-nums}
.hero-foot{position:relative;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--hero-mute)}
.pill{background:var(--accent);color:var(--accent-ink);font:700 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.quick{position:relative;margin:-34px 12px 0;background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;font:600 12px var(--f-body);padding:4px 2px;cursor:pointer}
.qa i,.svc i{width:46px;height:46px;border-radius:15px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-style:normal}

h2{font:700 18px var(--f-display);letter-spacing:-.01em;margin:28px 0 12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between}
.link{background:none;border:0;color:var(--brand);font:600 13px var(--f-body);cursor:pointer;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.svc{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;font:500 12px/1.25 var(--f-body);text-align:center;cursor:pointer}
.strip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.promo{flex:0 0 76%;scroll-snap-align:start;background:var(--brand-soft);border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.promo b{font:700 16px/1.25 var(--f-display)}
.promo small{color:var(--muted);font-size:13px}
.code{align-self:flex-start;border:1.5px dashed var(--brand);color:var(--brand);background:none;border-radius:8px;padding:4px 10px;font:700 12px var(--f-body);letter-spacing:.08em;cursor:pointer}
.card{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);padding:4px 14px}
.txlist{list-style:none;margin:0;padding:0}
.tx{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left;cursor:pointer}
.txlist li:last-child .tx{border-bottom:0}
.tx .t{min-width:0}
.tx b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{color:var(--muted);font-size:12.5px}
.tx .a{font:700 15px var(--f-body);font-variant-numeric:tabular-nums}
.tx .a.in{color:var(--good)}
.tdot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.tdot.in{color:var(--good)}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:12.5px}
.day{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:99px;font:600 14px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.sumrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sumrow div{background:var(--surface);border-radius:var(--r-m);padding:12px 14px;box-shadow:var(--shadow)}
.sumrow small{display:block;color:var(--muted);font-size:12.5px}
.sumrow b{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font:600 11px var(--f-body);padding:8px 0;cursor:pointer}
.nb[aria-current="page"]{color:var(--brand)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-28px;box-shadow:0 6px 16px rgba(0,0,0,.2)}

/* flows */
.flow{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding-top:env(safe-area-inset-top,0px)}
.flow-in{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fh{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:62px}
.fh h1{font:700 20px var(--f-display);letter-spacing:-.02em}
.fbody{flex:1;display:flex;flex-direction:column;gap:16px;padding-bottom:16px}
.fbar{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 30%);display:flex;flex-direction:column;gap:8px}
.btn{width:100%;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font:700 16px var(--f-body);padding:15px 18px;cursor:pointer}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;color:var(--muted)}
.search input,.field input{width:100%;min-width:0;font:500 16px var(--f-body);color:var(--ink);background:none;border:0;outline:none;padding:14px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font:600 13px var(--f-body);color:var(--muted)}
.field input{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.field input:focus,.search:focus-within{border-color:var(--brand)}
.crow{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;text-align:left;cursor:pointer}
.crow b{display:block;font-weight:600}
.crow small{color:var(--muted)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-display);background:hsl(var(--h) 45% var(--av-l));color:var(--ink)}
.pad{padding:16px 0}
.who{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.who b{display:block}
.amtbox{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding:4px 0}
.amtbox:focus-within{border-color:var(--brand)}
.amtbox span{font:700 26px var(--f-display);color:var(--muted)}
.amtbox input{border:0;background:none;outline:none;font:700 40px var(--f-display);letter-spacing:-.02em;color:var(--ink);width:100%;min-width:0;font-variant-numeric:tabular-nums;padding:4px 0}
.hint{min-height:20px;font-size:13.5px;color:var(--bad);font-weight:600}
.rows{margin:0;display:flex;flex-direction:column}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px dashed var(--line)}
.rows div:last-child{border-bottom:0}
.rows dt{color:var(--muted)}
.rows dd{margin:0;font-weight:600;text-align:right;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left;font:700 16px var(--f-body);cursor:pointer;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.bank{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:left;font:600 15px var(--f-body);cursor:pointer}
.bank[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.banks{display:flex;flex-direction:column;gap:8px}
.label{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.va{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--brand-soft);border-radius:var(--r-m);padding:16px}
.va b{font:700 22px var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.va button{flex:none;border:0;background:var(--brand);color:var(--brand-ink);border-radius:10px;padding:9px 12px;font:700 13px var(--f-body);cursor:pointer}
.steps{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.okc{width:80px;height:80px;border-radius:50%;background:var(--good);color:var(--surface);display:grid;place-items:center;margin:18px auto 4px;animation:pop .45s ease-out both}
.center{text-align:center}
.center h1{font:700 22px var(--f-display);margin:8px 0 2px}
.bigamt{font:700 34px var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ticket{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);padding:6px 16px}
.token{font:700 20px var(--f-display);letter-spacing:.04em;text-align:center;background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:14px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--brand-soft);border-radius:99px;padding:4px}
.seg button{border:0;background:none;border-radius:99px;padding:10px;font:700 14px var(--f-body);color:var(--brand);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.finder{position:relative;width:min(240px,70%);aspect-ratio:1;margin:4px auto;background:var(--scan-bg);border-radius:24px;overflow:hidden}
.finder::before,.finder::after{content:"";position:absolute;inset:22px;border:3px solid var(--accent);border-radius:14px;-webkit-mask:linear-gradient(#000 0 0) top left/34px 34px no-repeat,linear-gradient(#000 0 0) top right/34px 34px no-repeat,linear-gradient(#000 0 0) bottom left/34px 34px no-repeat,linear-gradient(#000 0 0) bottom right/34px 34px no-repeat;mask:linear-gradient(#000 0 0) top left/34px 34px no-repeat,linear-gradient(#000 0 0) top right/34px 34px no-repeat,linear-gradient(#000 0 0) bottom left/34px 34px no-repeat,linear-gradient(#000 0 0) bottom right/34px 34px no-repeat}
.finder i{position:absolute;left:30px;right:30px;height:2px;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:sweep 2.4s ease-in-out infinite alternate}
.qrbox{background:var(--qr-bg);padding:12px;border-radius:20px;width:min(260px,100%);aspect-ratio:1;margin:6px auto}
.qrbox svg{display:block;width:100%;height:100%}
.merch{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left;cursor:pointer}
.merch b{display:block;font-weight:600}
.merch small{color:var(--muted)}
.merch .tdot{border-radius:14px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--muted);font-size:12.5px}
.row button.plain{background:none;border:0;text-align:left;cursor:pointer;padding:0;font:inherit;display:block}
.sw{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prof{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:12px 0}
.prof .av{width:56px;height:56px;font-size:20px}

/* pin + toast */
.pinov{position:fixed;inset:0;z-index:40;background:rgba(8,20,18,.62);display:flex;align-items:flex-end;justify-content:center}
.pinsheet{width:100%;max-width:480px;background:var(--surface);border-radius:24px 24px 0 0;padding:18px max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.pinhead{display:flex;align-items:center;justify-content:space-between;font:700 17px var(--f-display);margin-bottom:12px}
.pinhead .icon-btn{box-shadow:none;background:var(--bg)}
.dots{display:flex;justify-content:center;gap:14px;padding:10px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}
.dots i.on{background:var(--brand)}
.dots.shake{animation:shake .35s}
.pinmsg{text-align:center;font-size:13.5px;color:var(--muted);min-height:20px;margin-bottom:8px}
.pinmsg.err{color:var(--bad);font-weight:600}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:62px;border-radius:16px;border:0;background:var(--bg);font:600 26px var(--f-display);cursor:pointer;display:grid;place-items:center}

 return '<svg viewBox="-1 -1 '+(N+2)+' '+(N+2)+'" fill="var(--qr-fg)" shape-rendering="crispEdges" role="img" aria-label="Contoh kode QR">'+r+fin(0,0)+fin(N-7,0)+fin(0,N-7)+'</svg>'}

var cam={stream:null,raf:0,warn:0};

function decodeQR(src,w,h,max){return new Promise(function(res){
 var k=Math.min(1,max/Math.max(w,h)),cw=Math.round(w*k),ch=Math.round(h*k),c=document.createElement('canvas');c.width=cw;c.height=ch;
 var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,cw,ch);
 var js=function(){try{var im=x.getImageData(0,0,cw,ch),r=window.jsQR&&jsQR(im.data,cw,ch);res(r?r.data:null)}catch(e){res(null)}};
 if(window.BarcodeDetector){try{new BarcodeDetector({formats:['qr_code']}).detect(c).then(function(a){a.length?res(a[0].rawValue):js()},js);return}catch(e){}}
 js()})}
function parseQris(s){s=String(s).trim();if(s.indexOf('000201')!==0)return null;var o={},i=0;
 while(i+4<=s.length){var tg=s.substr(i,2),ln=parseInt(s.substr(i+2,2),10);if(isNaN(ln))break;o[tg]=s.substr(i+4,ln);i+=4+ln}
 if(!o['59'])return null;var a=parseFloat(o['54']||'0');return {n:o['59'],loc:o['60']||'',fixed:a>0?Math.round(a):0}}
function gotQR(t){var q=parseQris(t);
 if(!q){if(Date.now()-cam.warn>2500){cam.warn=Date.now();toast('QR ini bukan QRIS')}return}
 stopCam();openFlow('pay',{m:{n:q.n,loc:(q.loc?q.loc+' · ':'')+'QRIS',fixed:q.fixed},amount:q.fixed})}

 navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){
  if(!F||F.name!=='scan'||F.data.tab==='mine'){s.getTracks().forEach(function(t){t.stop()});return}
  cam.stream=s;v.srcObject=s;v.play();st.textContent='Arahkan kamera ke kode QRIS';var busy=false;
  (function loop(){cam.raf=requestAnimationFrame(loop);if(busy||v.readyState<2||!v.videoWidth)return;busy=true;

 else if(t.id==='note')F.data.note=t.value;
 else if(t.id==='rn'){F.data.rname=t.value;sync()}
 else if(t.id==='rp'){F.data.rnum=t.value.replace(/\D/g,'').slice(0,16);t.value=F.data.rnum;sync()}
 else if(t.id==='to'){$('#clist').innerHTML=contactList(t.value)}
 else if(t.id==='cid'){F.data.cid=t.value.replace(/\D/g,'');t.value=F.data.cid;sync()}});

document.addEventListener('change',function(e){var t=e.target;if(t.id!=='qrfile'||!t.files[0])return;
 var u=URL.createObjectURL(t.files[0]),im=new Image();
 im.onload=function(){decodeQR(im,im.naturalWidth,im.naturalHeight,1400).then(function(r){URL.revokeObjectURL(u);if(r)gotQR(r);else toast('QR tidak terbaca. Coba foto yang lebih jelas')})};
 im.onerror=function(){toast('Gambar tidak bisa dibuka')};im.src=u;t.value=''});

/* ---------- menu bawah: kaca cair yang bisa digeser ---------- */
function setLens(left,w,drag){var nav=document.querySelector('.nav'),lens=document.getElementById('lens'),li=document.getElementById('lensIn'),ni=document.getElementById('nav');if(!nav||!lens||!li||!ni)return;
 var nr=nav.getBoundingClientRect(),ir=ni.getBoundingClientRect(),ex=drag?28:0,ey=drag?12:0;
 var L=left-ex/2,W=w+ex,T=4-ey,H=nr.height-8+2*ey,ox=ir.left-nr.left,cx=left+w/2;
 lens.style.left=L+'px';lens.style.width=W+'px';lens.style.top=T+'px';lens.style.height=H+'px';
 li.style.width=ir.width+'px';li.style.height=ir.height+'px';li.style.left=(ox-L)+'px';li.style.top=(ir.top-nr.top-T)+'px';
 li.style.transformOrigin=(cx-ox)+'px 50%';li.style.transform='scale('+(drag?1.3:1)+')';
 var real=[].slice.call(ni.querySelectorAll('.nb[data-tab]')),cl=[].slice.call(li.querySelectorAll('.nb[data-tab]'));
 real.forEach(function(b,i){var r=b.getBoundingClientRect(),c=r.left-nr.left+r.width/2;if(cl[i])cl[i].classList.toggle('under',Math.abs(c-cx)<r.width/2)})}
function placeLens(){var nav=document.querySelector('.nav'),lens=document.getElementById('lens'),li=document.getElementById('lensIn'),ni=document.getElementById('nav');if(!nav||!lens||!li||!ni)return;
 var b=ni.querySelector('.nb[aria-current="page"]');if(!b){lens.style.opacity=0;return}
 li.innerHTML=ni.innerHTML;li.setAttribute('inert','');
 var nr=nav.getBoundingClientRect(),br=b.getBoundingClientRect();lens.style.opacity=1;
 setLens(br.left-nr.left+4,br.width-8,false);
 if(!nav.classList.contains('ready')){void lens.offsetWidth;nav.classList.add('ready')}}
(function(){var nav=document.querySelector('.nav'),st=null,swallow=false;
 function btns(){return [].slice.call(nav.querySelectorAll('#nav .nb[data-tab]'))}
 function geo(){var nr=nav.getBoundingClientRect();return btns().map(function(b){var x=b.getBoundingClientRect();return {b:b,l:x.left-nr.left+4,w:x.width-8}})}
 function nearest(left,w){var r=geo(),c=left+w/2,best=r[0];r.forEach(function(o){if(Math.abs(o.l+o.w/2-c)<Math.abs(best.l+best.w/2-c))best=o});return best}
 nav.addEventListener('pointerdown',function(e){var b=e.target.closest&&e.target.closest('#nav .nb[data-tab]');if(!b)return;var g=geo(),me=g.filter(function(o){return o.b===b})[0];if(!me)return;
  st={x:e.clientX,left:me.l,w:me.w,drag:false,id:e.pointerId,min:g[0].l,max:g[g.length-1].l,cur:me.l,tabBtn:b};
  try{nav.setPointerCapture(e.pointerId)}catch(_){}
  nav.classList.add('press');setLens(me.l,me.w,true)});
 nav.addEventListener('pointermove',function(e){if(!st)return;var dx=e.clientX-st.x;
  if(!st.drag){if(Math.abs(dx)<6)return;st.drag=true;nav.classList.remove('press');nav.classList.add('dragging')}
  st.cur=Math.max(st.min,Math.min(st.max,st.left+dx));setLens(st.cur,st.w,true)});
 function end(ev){if(!st)return;var s=st;st=null;nav.classList.remove('press');
  if(!s.drag){var t=s.tabBtn&&s.tabBtn.dataset.tab;if(ev&&ev.type==='pointerup'&&t&&t!==tab){tab=t;render();window.scrollTo(0,0)}else placeLens();return}
  nav.classList.remove('dragging');swallow=true;setTimeout(function(){swallow=false},60);
  var n=nearest(s.cur,s.w);
  if(ev&&ev.type==='pointerup'&&n.b.dataset.tab&&n.b.dataset.tab!==tab){tab=n.b.dataset.tab;render();window.scrollTo(0,0)}else placeLens()}
 nav.addEventListener('pointerup',end);nav.addEventListener('pointercancel',end);
 nav.addEventListener('click',function(e){if(swallow){e.stopPropagation();e.preventDefault()}},true);
 window.addEventListener('resize',placeLens);window.addEventListener('load',placeLens)})();

render();
})();
</script>
